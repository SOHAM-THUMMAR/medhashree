name: Medhashree CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Python Deployment & Monitor Syntax Verification
  # -------------------------------------------------------------
  python-verification:
    name: Python Deployment & Sidecar Monitor Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Verify Python Scripts Compilation
        run: |
          python -m py_compile start.py
          python -m py_compile monitor.py
          python -m py_compile scripts/server-setup.py
          python -m py_compile scripts/setup/*.py

      - name: Test Monitor Daemon Execution
        run: |
          python monitor.py &
          sleep 2
          curl -f http://127.0.0.1:5001/metrics || exit 1

  # -------------------------------------------------------------
  # Job 2: Node.js Syntax, Lint, and Build Check
  # -------------------------------------------------------------
  lint-and-build:
    name: Node.js & React Build Verification
    runs-on: ubuntu-latest
    needs: python-verification

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      # Verify Root Centralized .env Template
      - name: Verify Centralized Environment Template
        run: |
          test -f .env.example || (echo "Missing root .env.example template!" && exit 1)

      # Install & Lint Backend
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install || npm ci

      - name: Lint Backend
        working-directory: ./backend
        run: pnpm run lint || npm run lint

      - name: Verify Backend Code Syntax
        working-directory: ./backend
        run: node --check server.js

      # Install & Lint & Build Frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install || npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: pnpm run lint || npm run lint

      - name: Build Frontend (React + Vite)
        working-directory: ./frontend
        run: pnpm run build || npm run build

  # -------------------------------------------------------------
  # Job 3: Code Quality, Duplication & Dependency Check
  # -------------------------------------------------------------
  code-quality:
    name: Code Quality & Maintenance Checks
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for Code Duplication (jscpd)
        run: |
          echo "=== RUNNING CODE DUPLICATION CHECK (jscpd) ==="
          npx jscpd --min-tokens 80 --min-lines 15 frontend/src backend/controllers backend/routes backend/services backend/models || true

      - name: Check for Unused Dependencies (depcheck)
        run: |
          echo "=== RUNNING UNUSED DEPENDENCY CHECK ==="
          echo "--- Frontend ---"
          npx depcheck ./frontend --ignores="postcss,tailwindcss,autoprefixer,@eslint/js,eslint-plugin-react-hooks,eslint-plugin-react-refresh,globals" || true
          echo "--- Backend ---"
          npx depcheck ./backend --ignores="@eslint/js,globals,nodemon" || true

  # -------------------------------------------------------------
  # Job 4: Security & Hackability Scans
  # -------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependency vulnerability check
      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      # Secrets scanner
      - name: Scan Code for Leaked Secrets & Credentials
        run: node scripts/security-check.js

  # -------------------------------------------------------------
  # Job 5: GitHub Native CodeQL Security Analysis (SAST)
  # -------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # Job 6: SEO and Accessibility Check
  # -------------------------------------------------------------
  seo-audit:
    name: SEO & Semantic HTML Audit
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SEO and Semantic Validator
        run: node scripts/seo-check.js
